services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nigrani
      POSTGRES_PASSWORD: nigrani
      POSTGRES_DB: nigrani
    ports:
      - "5432:5432"
    volumes:
      - nigrani-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nigrani -d nigrani"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nigrani-pgdata:
